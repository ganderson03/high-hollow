[package]
name = "high-hollow-server"
version = "0.1.0"
edition = "2024"
description = "Authoritative server for High Hollow: JSON Lines over TCP, two seats, the trail"
publish = false

[lib]
name = "hollow"
path = "src/lib.rs"

[[bin]]
name = "high-hollow-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
